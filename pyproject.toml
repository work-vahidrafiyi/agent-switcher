[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-switcher"
version = "0.3.0"
description = "Switch and monitor multiple OpenAI Codex accounts from one app."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "agent-switcher contributors"},
]
dependencies = [
  "PySide6-Essentials>=6.6",
  "pyqtdarktheme>=2.1; python_version < '3.12'",
  "pyqtdarktheme-fork>=2.3.2; python_version >= '3.12'",
  "qtawesome>=1.3",
  "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
asw = "agent_switcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_switcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
