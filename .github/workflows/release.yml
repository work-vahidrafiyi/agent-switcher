name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Install UPX on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx --yes --no-progress

      - name: Build standalone GUI
        run: pyinstaller --noconfirm --clean packaging/agent-switcher.spec

      - name: Enforce Linux binary size budget
        if: runner.os == 'Linux'
        shell: bash
        run: |
          actual_bytes=$(stat -c '%s' dist/agent-switcher)
          maximum_bytes=$((41 * 1024 * 1024))
          echo "Linux binary: $actual_bytes bytes (budget: $maximum_bytes bytes)"
          test "$actual_bytes" -le "$maximum_bytes"

      - name: Smoke-test Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen CODEX_HOME="$RUNNER_TEMP/codex" \
            timeout 8s dist/agent-switcher
          result=$?
          set -e
          test "$result" -eq 124

      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex"
          $process = Start-Process -FilePath "dist/agent-switcher.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "The standalone app exited during its smoke test."
          }
          Stop-Process -Id $process.Id -Force

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/agent-switcher-linux-x86_64.tar.gz -C dist agent-switcher

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item dist/agent-switcher.exe release/agent-switcher-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: agent-switcher-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Read release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md entry found for version $version" >&2
            exit 1
          fi

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
