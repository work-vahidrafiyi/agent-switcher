name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Build standalone GUI
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name agent-switcher
          --paths src
          --collect-all qtawesome
          --collect-all qdarktheme
          --collect-all pynput
          --collect-data agent_switcher
          --copy-metadata agent-switcher
          --hidden-import PySide6.QtSvg
          packaging/pyinstaller_entry.py

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/agent-switcher-linux-x86_64.tar.gz -C dist agent-switcher

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item dist/agent-switcher.exe release/agent-switcher-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: agent-switcher-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Read release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md entry found for version $version" >&2
            exit 1
          fi

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
